version: 2
updates:
  # Only GitHub Actions. go.mod and ui/pnpm-lock.yaml point at the Prusa
  # Connect Local source tree in .core (replace / link:), which Dependabot
  # cannot resolve. Those dependencies follow CORE_COMMIT in the Makefile
  # and are reviewed by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # wait a week before proposing a freshly published version:
    # gives the community time to spot a compromised release
    cooldown:
      default-days: 7
