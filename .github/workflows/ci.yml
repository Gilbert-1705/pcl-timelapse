name: CI

# Builds and tests the Go module on every pull request and push to main.
# The browser bundle is built by release-check.yml (marketplace dry run).

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go vet, tests and cross-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-go v7.1.0
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install ffmpeg (used by the tests that encode real video)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -n 1

      - name: Fetch the Prusa Connect Local SDK
        # Clones CORE_COMMIT and refuses it unless it is the commit in CORE_SHA.
        run: make core-sdk

      - name: Vet and test
        run: make test

      - name: Cross-build the platforms from module.yaml
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -o /dev/null .
            echo "built $target"
          done

  commit-messages:
    name: No session links in commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A commit may name its co-author, but not link a private work session.
      - name: Refuse Claude-Session trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          found="$(git log --format='%h %(trailers:key=Claude-Session,valueonly,separator=%x2C)' "$BASE..$HEAD" | awk 'NF > 1')"
          if [ -n "$found" ]; then
            echo "::error::These commits carry a Claude-Session trailer:"
            echo "$found"
            exit 1
          fi
          echo "No session links in $(git rev-list --count "$BASE..$HEAD") commits."
