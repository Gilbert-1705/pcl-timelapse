# Timelapse for Prusa Connect Local.
#
# One module with both halves: the Go process (main.go), which reads the
# camera and builds the videos, and the browser bundle in ui/, which adds a
# "Zeitraffer" tab to the printer page. Title and summary are English for the
# marketplace; the tab and the setting descriptions are German.
#
# Needs ffmpeg on the server (not part of Prusa Connect Local), see README.md.
#
# Install from a release folder (see README.md):
#   prusa-connect module add github.com/gilbert-1705/pcl-timelapse@0.2.2 -from <release> -approve

name: timelapse
title: Timelapse
summary: Records every print as a timelapse video, one frame per layer, without extra G-code. Reads an RTSP or snapshot camera and needs ffmpeg installed on the server.
codeowner: Gilbert-1705
kind: sink
version: 0.2.2
license: MIT
contract_major: 1
openapi: openapi.json
platforms:
  - linux_amd64
  - linux_arm64
  - darwin_arm64
  - darwin_amd64

require:
  # Built and tested against Prusa Connect Local 0.1.0-beta.1.
  core: ">=0.1.0-beta.1"
  core-device.get: "*"
  core-device.list: "*"
  # File name of the print when the start event does not carry it yet.
  core-device.jobs: "*"
  core-storage.write: "*"

# observe: Druckerzustand und Ereignisse lesen. write_storage: Videos ablegen.
permissions:
  - observe
  - write_storage

needs:
  # Einzelbilder der laufenden Schicht und die ausgewählten Bilder bis zum
  # Druckende liegen hier, nicht im Speicher.
  data: true
  # Go-Prozess plus ffmpeg, das den H.264-Strom der Kamera dekodiert.
  memory_mib: 512

# The only connection outside Prusa Connect: the camera the operator sets in
# camera_url. The process enforces this list (camera.go): another port is
# refused when the settings are read, and a snapshot redirect is followed only
# to the same scheme, host and port. For rtsp:// and rtsps:// the process
# starts ffmpeg (setting ffmpeg, no shell, fixed arguments, frames.go) with
# -rtsp_transport tcp, so ffmpeg opens one TCP connection to that address.
# Details for reviewers: docs/security-notes.md.
egress:
  - option: camera_url
    ports: [554, 8554, 322, 80, 8080, 443]
    from: process
    why: Reads the camera while a print runs, an RTSP stream through ffmpeg or a JPEG snapshot address, to pick one frame per layer.
    sends: The stream or image request to the camera address, with the camera username and password when they are set. No print data.

options:
  - key: camera_url
    type: url
    default: ""
    summary: Adresse der Kamera. rtsp://… für den Videostrom (Buddy3D), http://… für eine Adresse, die ein einzelnes JPEG liefert. Erlaubte Ports 554, 8554, 322, 80, 8080 und 443. Leer nimmt nichts auf.
  - key: camera_username
    type: string
    default: ""
    summary: Benutzername der Kamera, falls sie einen verlangt.
  - key: camera_password
    type: secret
    default: ""
    summary: Passwort der Kamera, falls sie eines verlangt.
  - key: printer
    type: string
    default: ""
    summary: Name oder ID des Druckers, den die Kamera filmt. Leer nimmt den einzigen Drucker bzw. den ersten, der einen Druck startet.
  - key: storage
    type: string
    default: local
    summary: Speicher, in den die Zeitraffer geschrieben werden.
  - key: folder
    type: string
    default: zeitraffer
    summary: Ordner im Speicher. Darunter je Drucker ein Ordner und je Druck einer mit zeitraffer.mp4, vorschau.jpg und info.json.
  - key: capture_fps
    type: number
    default: "2"
    summary: Wie viele Bilder pro Sekunde aus dem Strom gelesen werden, um daraus je Schicht das beste zu wählen.
  - key: video_fps
    type: int
    default: "30"
    summary: Bilder pro Sekunde im fertigen Video. 300 Schichten ergeben bei 30 also 10 Sekunden.
  - key: hold_last_s
    type: number
    default: "1.5"
    summary: Wie lange das letzte Bild am Ende des Videos stehen bleibt, in Sekunden.
  - key: layer_settle
    type: duration
    default: 12s
    summary: Wie lange eine neue Z-Höhe halten muss, bis sie als neue Schicht gilt. Filtert Z-Hops heraus. Muss über dem Telemetrie-Abstand des Druckers (5 s) liegen.
  - key: min_layers
    type: int
    default: "10"
    summary: Drucke mit weniger Schichten bekommen kein Video.
  - key: max_frames_per_layer
    type: int
    default: "240"
    summary: Obergrenze an Bildern, die je Schicht zur Auswahl vorgehalten werden. Bei langen Schichten wird ausgedünnt.
  - key: keep_frames
    type: bool
    default: "false"
    summary: Die ausgewählten Einzelbilder zusätzlich zum Video im Ordner bilder/ ablegen.
  - key: timezone
    type: string
    default: Europe/Berlin
    summary: Zeitzone für Datum und Uhrzeit im Ordnernamen, etwa Europe/Berlin. Leer nimmt die des Servers (im Container meist UTC).
  - key: diagnose_layers
    type: int
    default: "0"
    summary: Diagnose. Für so viele Schichten eines Drucks werden alle Kandidatenbilder samt Bewertung und Referenzbild unter diagnose/ neben dem Video abgelegt (960 Pixel breit, etwa 5 bis 10 MB pro Schicht). 0 schaltet die Diagnose aus.
  - key: diagnose_every
    type: int
    default: "20"
    summary: Diagnose. Jede wievielte Schicht festgehalten wird, ab dieser Schicht. Bei 20 also Schicht 20, 40, 60 und so weiter, bis diagnose_layers erreicht ist.
  - key: performance
    type: string
    default: normal
    summary: "normal oder low. low ist für kleine Rechner wie einen Raspberry Pi: Vom Kamerastrom werden nur Keyframes dekodiert, höchstens ein Bild pro Sekunde mit 1280 Pixeln, und das Video wird mit einem Thread und niedriger Priorität gebaut. Das spart CPU und Speicher, dauert aber länger und gibt pro Schicht weniger Bilder zur Auswahl."
  - key: gcode_park
    type: bool
    default: "false"
    summary: Nur einschalten, wenn der Slicer den Druckkopf nach jedem Schichtwechsel kurz aus dem Bild parkt (Anleitung in docs/gcode-park.md). Dann nimmt der Zeitraffer das Bild, auf dem der Kopf still steht, statt es zu schätzen. Ohne Park-G-Code bleibt es aus.
  - key: park_window
    type: duration
    default: 20s
    summary: Wie lange nach Beginn einer Schicht nach dem geparkten Kopf gesucht wird (3 s bis 2 min). Muss länger sein als Parkbewegung und Wartezeit zusammen.
  - key: ffmpeg
    type: string
    default: ffmpeg
    summary: Pfad zu ffmpeg auf dem Server. ffmpeg gehört nicht zu Prusa Connect Local und muss auf dem Server installiert sein (siehe README). Fehlt es, zeigt der Tab Zeitraffer einen Hinweis.

ui:
  entry: ui/index.js
  library: ">=0.0.1 <1.0.0"
  contributes:
    device_tab:
      - id: zeitraffer
        title: Zeitraffer
    device_section:
      - id: zeitraffer
        title: Zeitraffer
